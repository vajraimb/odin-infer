name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15 # Apple Silicon runner (arm64 + Metal)
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin (pinned to the version this repo is built with)
        run: |
          curl -sSL -o /tmp/odin.tar.gz \
            https://github.com/odin-lang/Odin/releases/download/dev-2026-07/odin-macos-arm64-dev-2026-07.tar.gz
          tar -xzf /tmp/odin.tar.gz -C /tmp
          ODIN_DIR=$(echo /tmp/odin-macos-arm64-*/)
          echo "${ODIN_DIR%/}" >> "$GITHUB_PATH"   # persist to later steps
          export PATH="$PATH:${ODIN_DIR%/}"      # this step too
          odin version

      - name: Install numpy (MoE reference generator)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q numpy
          echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: Check generated MSL tables are in sync
        run: python3 tools/gen_msl_tables.py --check
      - name: Build + unit tests
        run: ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odin-infer-binaries
          path: |
            bin/odin-serve
            bin/odin-cli

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes = the latest section of CHANGELOG.md
          awk 'NR==1{next} /^## v/{if (seen) exit; seen=1} {print}' CHANGELOG.md > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            bin/odin-serve bin/odin-cli \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md
