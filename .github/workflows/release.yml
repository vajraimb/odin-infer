name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Apple Silicon runner (arm64 + Metal)
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        run: |
          brew update
          brew install odin
          odin version

      - name: Build + unit tests
        run: ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odin-infer-binaries
          path: |
            bin/odin-serve
            bin/odin-cli

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            bin/odin-serve bin/odin-cli \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
